spring.application.name=FinanceControl

# Server
server.port=${PORT:8081}


# Database Configuration (H2 File-based with AUTO_SERVER=TRUE for multi-process access)
spring.datasource.url=jdbc:h2:file:./data/finance_db;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway (disabled for H2 local dev, enabled for postgres profile)
spring.flyway.enabled=false

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT
jwt.secret=9a6140f7d5424fd53f7c32bfd1544a47d0d1e57c6b41249e0c5b5257ef51a7b1
jwt.expiration=86400000

# CORS
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
